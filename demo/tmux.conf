# Only this plugin, no user config: `record.sh` starts tmux with `-f` pointing here.

set -g @session-new-key "t"
set -g @session-prev-key "("
set -g @session-next-key ")"
set -g @session-kill-key "w"
set -g @session-move-left-key "Left"
set -g @session-move-right-key "Right"

# Stock tmux opens a window in the session's start dir (`~` here), which relabels the tab.
bind c new-window -c "#{pane_current_path}"

run-shell "#{d:current_file}/../session-tabs.tmux"
